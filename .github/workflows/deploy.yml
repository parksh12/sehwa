# GitHub Pages 자동 배포: main에 푸시할 때 + 매일 한국 시간 자정(오늘의 운세 갱신)
name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "1 15 * * *" # UTC 15:01 = KST 00:01
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
        env:
          # 저장소 변수가 비어 있으면 빈 문자열 → config.mjs 기본값(현재 주소) 사용. 전환 절차: 산출물/P2-19_도메인_GA4_전환절차.md
          SITE_URL: ${{ vars.SITE_URL }}
          GA_ID: ${{ vars.GA_ID }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
